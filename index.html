<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF表紙作成・印刷用調整ツール</title>
    <link rel="stylesheet" href="style.css">
    <!-- jsPDF (表紙のテキスト描画用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- pdf-lib (既存PDFの読み込み・結合・反転用) -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>PDF表紙作成・印刷用調整ツール</h1>

        <!-- ① 表紙を作る -->
        <section class="section-box">
            <h2>① 表紙を作る</h2>

            <div class="form-group">
                <label for="titleInput">タイトルを記入</label>
                <input type="text" id="titleInput" placeholder="例: 月次業務報告書" value="無題">
            </div>

            <div class="form-group">
                <label>日付の記入</label>
                <div class="radio-options">
                    <label><input type="radio" name="dateMode" value="yes" checked> 記入する</label>
                    <label><input type="radio" name="dateMode" value="no"> 記入しない</label>
                </div>
            </div>

            <div class="form-group">
                <label for="memoInput">(任意) メモの記入 (Markdownも可)</label>
                <textarea id="memoInput" rows="5" placeholder="# 概要&#10;- 参加者：山田、鈴木&#10;- 目的：進捗確認"></textarea>
            </div>
        </section>

        <!-- ② PDFと結合する -->
        <section class="section-box">
            <h2>② PDFと結合する</h2>

            <div class="form-group">
                <label for="pdfFileInput">ファイルを選択</label>
                <input type="file" id="pdfFileInput" accept="application/pdf">
                <small class="hint">※選択しない場合は表紙単体（1ページ）だけ作成されます</small>
            </div>

            <div class="form-group">
                <label>順番</label>
                <div class="radio-options">
                    <label><input type="radio" name="orderMode" value="normal" checked> そのまま (横書き用)</label>
                    <label><input type="radio" name="orderMode" value="reverse"> 逆にする (縦書き用)</label>
                </div>
            </div>
        </section>

        <!-- ③ 完成！ -->
        <section class="section-box complete-box">
            <h2>③ 完成！</h2>
            <button id="generateBtn">ダウンロード</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
